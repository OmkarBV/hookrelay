spring:
  application:
    name: hookrelay-dispatcher

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hookrelay}
    username: ${POSTGRES_USER:hookrelay}
    password: ${POSTGRES_PASSWORD:hookrelay}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  # hookrelay-api owns schema migrations; running Flyway from a second
  # deployable against the same database is redundant at best and a race at
  # worst if both start up at once.
  flyway:
    enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: hookrelay-dispatcher
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapped in ErrorHandlingDeserializer rather than used directly: a
      # malformed message (JSON that doesn't match DeliveryTaskMessage)
      # would otherwise throw during Consumer.poll() itself and kill the
      # consumer thread, bypassing DefaultErrorHandler entirely. The wrapper
      # catches per-record deserialization failures so they route through
      # the same error handler as any other failure — see
      # KafkaErrorHandlingConfig, which sends them to the dead-letter topic.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: io.hookrelay.common.delivery
        spring.json.value.default.type: io.hookrelay.common.delivery.DeliveryTaskMessage
    # Needed for the retry sweeper (RetrySweeper), which republishes a FAILED
    # delivery once its nextAttemptAt has passed — the same DeliveryPublisher
    # hookrelay-api uses for the initial publish.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        spring.json.add.type.headers: false
    listener:
      # One consumer thread per partition: partitioning by endpointId only
      # gives per-endpoint ordering if each partition is consumed
      # sequentially by a single thread (see DeliveryTaskListener).
      concurrency: 6

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # This service is almost entirely blocked-on-network-IO (HTTP deliveries,
  # DB, Kafka), which is exactly the workload virtual threads exist for —
  # see DeliveryExecutionService's Javadoc for the full reasoning. This one
  # flag switches Spring's built-in executors (including the Kafka listener
  # container's) to virtual threads.
  threads:
    virtual:
      enabled: true

server:
  port: 8082

hookrelay:
  security:
    secret-encryption-key: ${HOOKRELAY_SECRET_ENCRYPTION_KEY:2P0OfgmRP7wHAAILerwZoJCC92TIw0RjZ4l0kXhIT/k=}
  dispatcher:
    # Hard cap on total concurrent in-flight HTTP deliveries across every
    # endpoint. Virtual threads are cheap; sockets, memory, and the
    # receiving servers on the other end are not.
    max-inflight: ${HOOKRELAY_DISPATCHER_MAX_INFLIGHT:500}
    # Per-endpoint concurrency cap so retries or multiple dispatcher
    # instances can't pile more than this many simultaneous attempts onto
    # one customer's endpoint.
    per-endpoint-max-concurrent: 5
    default-timeout-ms: 10000
    sweeper:
      interval-ms: 5000
      batch-size: 100
      # How far to push a locked row's next_attempt_at forward before
      # republishing to Kafka — see RetrySweeper's Javadoc for why this,
      # rather than a status change, is what prevents a double-pick.
      republish-guard-seconds: 120
    circuit-breaker:
      failure-threshold: 5
      wait-duration-seconds: 300
      auto-pause-after-opens: 3
    partition-maintenance:
      # Cron: run once daily. ShedLock (see PartitionMaintenanceJob) ensures
      # only one dispatcher instance actually executes it.
      cron: "0 0 3 * * *"
      months-ahead: 2
      retention-months: 6

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # Real readiness, not just "the process is up": shows DB, Redis, and
      # Kafka reachability individually (DataSource/Redis indicators are
      # Spring Boot auto-configured; Kafka's is KafkaHealthIndicator below).
      show-details: always
