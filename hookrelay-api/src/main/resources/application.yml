spring:
  application:
    name: hookrelay-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hookrelay}
    username: ${POSTGRES_USER:hookrelay}
    password: ${POSTGRES_PASSWORD:hookrelay}

  jpa:
    # Explicitly false: TenantScopingFilter binds its own request-scoped
    # EntityManager so it can enable the tenant Hibernate filter on it. Two
    # session-binding mechanisms fighting over the same request would be
    # confusing at best.
    open-in-view: false
    hibernate:
      # Flyway owns schema evolution; Hibernate must never auto-generate DDL.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Durability over throughput: this topic is the "wake up and try this
        # delivery" signal, and it's cheap to send, so there's no reason to
        # trade acks for latency here.
        acks: all
        spring.json.add.type.headers: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8081

hookrelay:
  security:
    jwt:
      secret: ${HOOKRELAY_JWT_SECRET:change-me-to-a-random-64-byte-base64-secret}
      ttl-seconds: 3600
    # Dev-only default (generated with `openssl rand -base64 32`). Any real
    # deployment must override this — it decrypts every endpoint signing
    # secret in the database.
    secret-encryption-key: ${HOOKRELAY_SECRET_ENCRYPTION_KEY:2P0OfgmRP7wHAAILerwZoJCC92TIw0RjZ4l0kXhIT/k=}
  ingestion:
    rate-limit:
      # Per-application ingestion cap — a token bucket in Redis, so it holds
      # across every hookrelay-api instance, not just one. requests-per-second
      # is the sustained rate; burst-capacity is how many requests can arrive
      # back-to-back before the sustained rate kicks in.
      requests-per-second: 50
      burst-capacity: 100

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # Real readiness, not just "the process is up": shows DB, Redis, and
      # Kafka reachability individually (DataSource/Redis indicators are
      # Spring Boot auto-configured; Kafka's is KafkaHealthIndicator below).
      show-details: always
